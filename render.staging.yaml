# Render Blueprint — STAGING ONLY. See docs/DEPLOYMENT.md for the full runbook.
# This file describes infrastructure only; it does not deploy anything by itself.
# Render creates these (billable, though the web service can run on the Free plan —
# see docs/DEPLOYMENT.md's staging cost note) only once you connect this repo in the
# Render dashboard and explicitly approve creating them. Production uses render.yaml
# instead — kept as a separate file so staging and production are never accidentally
# deployed from the same blueprint run.

services:
  - type: web
    name: blipz-backend-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free  # cold starts are acceptable for internal/staging use — see docs/DEPLOYMENT.md
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""

  - type: cron
    name: blipz-generate-tomorrow-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 22 * * *"  # 22:00 UTC daily
    # RENDER_EXTERNAL_HOSTNAME is a web service's own public hostname — a cron job
    # has no such thing to expose, so a cron job can't rely on its own copy of that
    # variable to reach the web service. BLIPZ_API_BASE_URL is entered manually
    # (sync: false) once the blipz-backend-staging web service exists and its real
    # URL is known — see docs/DEPLOYMENT.md's "after deploying" step. Full HTTPS URL,
    # no trailing slash — same value pasted into Staging.xcconfig.
    dockerCommand: >
      sh -c "curl -sf -X POST $BLIPZ_API_BASE_URL/admin/generate-content
      -H \"x-admin-token: $ADMIN_TOKEN\""
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: BLIPZ_API_BASE_URL
        sync: false

  - type: cron
    name: blipz-publish-today-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "5 0 * * *"  # 00:05 UTC daily
    # See blipz-generate-tomorrow-staging above for why this is BLIPZ_API_BASE_URL
    # rather than RENDER_EXTERNAL_HOSTNAME.
    dockerCommand: >
      sh -c "curl -sf -X POST $BLIPZ_API_BASE_URL/admin/publish-content
      -H \"x-admin-token: $ADMIN_TOKEN\""
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: BLIPZ_API_BASE_URL
        sync: false
